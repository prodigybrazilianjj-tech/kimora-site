<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!--
      These are the BASELINE head tags. In production every one of them is
      rewritten per-route by server/seo.ts before the HTML is sent, using the
      table in shared/seo.ts — a wouter route change never touches <head>, so
      without that stamping the whole site reports the homepage's title.
      What you edit here is what dev and any un-stamped fallback will show.

      Deliberately absent: the canonical link element. Hardcoded here it would
      name the homepage on every route and mark /faq, /shop and /product as
      duplicates of /. It is only ever correct per-request, so server/seo.ts
      owns it.

      Canonical host is www — the apex 301s to it.
    -->
    <title>Kimora Co. | Creatine + Electrolyte Stick Packs for BJJ &amp; MMA</title>
    <meta name="description" content="5 g creatine monohydrate plus real electrolytes in a single-serve stick. Naturally sweetened with stevia and monk fruit. Built for BJJ, MMA and lifters." />

    <!-- Open Graph -->
    <meta property="og:title" content="Kimora Co. | Creatine + Electrolyte Stick Packs for BJJ &amp; MMA" />
    <meta property="og:description" content="5 g creatine monohydrate plus real electrolytes in a single-serve stick. Naturally sweetened with stevia and monk fruit. Built for BJJ, MMA and lifters." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.kimoraco.com/" />
    <meta property="og:image" content="https://www.kimoraco.com/opengraph.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kimora Co. | Creatine + Electrolyte Stick Packs for BJJ &amp; MMA" />
    <meta name="twitter:description" content="5 g creatine monohydrate plus real electrolytes in a single-serve stick. Naturally sweetened with stevia and monk fruit. Built for BJJ, MMA and lifters." />
    <meta name="twitter:image" content="https://www.kimoraco.com/opengraph.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon2.png?v=3" />

    <!-- iPhone Home Screen Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/iphone-touch-icon.png?v=3" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Gabarito:wght@500;600;700;800;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!--
      Pixel base tags. Three-platform install (GA4 + TikTok + Meta).
      Each block no-ops silently if its VITE_* env var is missing at build
      time, so dev builds stay quiet.
    -->

    <!-- GA4 (gtag.js) -->

        // placeholder remains. Bail in that case so the page stays clean.

        var s = document.createElement("script");

        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag("js", new Date());
        window.gtag("config", id, { send_page_view: true });
      })();
    </script>

  </head>
